version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: kamus_mysql
    environment:
      MYSQL_ROOT_PASSWORD: 
      MYSQL_DATABASE: if0_43177500_db
      MYSQL_USER: if0_43177500
      MYSQL_PASSWORD: kamus_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  backend:
    build: ./backend
    container_name: kamus_backend
    ports:
      - "3306:3306"
    environment:
      - DB_HOST=sql308.infinityfree.com 
      - DB_USER=if0_43177500
      - DB_PASSWORD=kamus_password
      - DB_NAME=if0_43177500_db
      - PORT=3306
    depends_on:
      - db

volumes:
  mysql_data:
